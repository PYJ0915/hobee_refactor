<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>신고 관리 | Ho-Bee Admin</title>

  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/report/manage-report.css">
</head>

<body>

  <!-- 헤더 -->
  <th:block th:replace="~{common/fragments/header}" />

  <div class="page-wrapper">

    <main class="admin-report-container">

      <h1 class="admin-title">신고 관리</h1>
      <p class="admin-sub">사용자 신고 내역을 관리할 수 있습니다.</p>

      <table class="report-table">
        <thead>
          <tr>
            <th>신고 사유</th>
            <th>상세 내용</th>
            <th>신고자</th>
            <th>피신고자</th>
            <th>신고 날짜</th>
            <th>작성 글 보기</th>
            <th>처리</th>
          </tr>
        </thead>

        <tbody>
          <!-- 신고 목록 반복 -->
          <tr th:each="report : ${reportList}">
            <td th:text="${report.reportReason}">
              욕설 / 비하 표현
            </td>

            <td class="detail" th:text="${report.reportDetail}">
              지속적인 욕설과 공격적인 표현을 사용했습니다.
            </td>

            <td th:text="${report.reporterNickname}">
              신고자닉네임
            </td>

            <td th:text="${report.reportedNickname}">
              피신고자닉네임
            </td>

            <td th:text="${report.reportDate}">
              2025.01.01
            </td>

            <td>
              <button class="watch-btn" th:data-report-no="${report.reportNo}">보기</button> 
            </td>

            <td class="action-cell">
              <button class="approve-btn" id="APPROVED" th:data-report-no="${report.reportNo}">승인</button>
              <button class="reject-btn" id="REJECTED" th:data-report-no="${report.reportNo}">거절</button>
            </td>
          </tr>

          <!-- 신고 없을 때 -->
          <tr th:if="${#lists.isEmpty(reportList)}">
            <td colspan="7" class="empty">
              현재 접수된 신고가 없습니다.
            </td>
          </tr>

        </tbody>
      </table>

      <!-- 신고가 있을 때만 페이지네이션이 보이게 할 예정 -->
      <div class="pagination-area" th:if="${!#lists.isEmpty(reportList)}">

        <!-- 일반 목록 조회 (검색 X )-->
        <ul class="pagination" th:object="${pagination}">

          <!-- 첫 페이지로 이동 -->
          <li><a th:href="@{/report/manageReport(cp=1)}">&lt;&lt;</a></li>

          <!-- 이전 목록 마지막 번호로 이동 -->
          <li><a th:href="@{/report/manageReport(cp=*{prevPage})}">&lt;</a></li>

          <!-- 특정 페이지로 이동 -->

          <th:block th:each="i : *{#numbers.sequence(startPage, endPage)}">

            <!-- 현재 보고있는 페이지 -->
            <li th:if="${i} == *{currentPage}">
              <a class="current" th:text="${i}">현재페이지</a>
            </li>

            <!-- 보고있지 않은 페이지 -->
            <li th:unless="${i} == *{currentPage}">
              <a th:href="@{/report/manageReport(cp=${i})}" th:text="${i}">이동할 페이지</a>
            </li>
          </th:block>

          <!-- 다음 목록 시작 번호로 이동 -->
          <li><a th:href="@{/report/manageReport(cp=*{nextPage})}">&gt;</a></li>

          <!-- 끝 페이지로 이동 -->
          <li><a th:href="@{/report/manageReport(cp=*{maxPage})}">&gt;&gt;</a></li>
        </ul>
      </div>

    </main>

  </div>

  <!-- 신고 콘텐츠 확인 모달 -->
<div class="report-modal-overlay popup-hidden">
  <div class="report-modal">

    <!-- 헤더 -->
    <div class="modal-header">
      <span class="content-type post">신고된 게시글 / 댓글 내용</span>
      <!-- 댓글일 경우 class="comment" -->
      <button class="modal-close">&times;</button>
    </div>

    <!-- 본문 -->
    <div class="modal-body">

      <!-- 작성 정보 -->
      <div class="content-meta">
        <p class="writer">작성자 : 충모오옷떼</p>
      </div>

      <!-- 신고된 내용 -->
      <div class="reported-content">
        <div class="content-box">
          여기에 신고된 게시글 또는 댓글 내용이 표시됩니다.
          <br>
          여러 줄의 텍스트도 자연스럽게 표시됩니다.
        </div>
      </div>

    </div>

  </div>
</div>


  <!-- 푸터 -->
  <th:block th:replace="~{common/fragments/footer}" />

  <script src="/js/report/manage-report.js"></script>

</body>

</html>
