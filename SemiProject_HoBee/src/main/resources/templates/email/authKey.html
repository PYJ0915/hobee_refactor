<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ho-Bee 이메일 인증</title>
</head>

<body style="margin:0; padding:0; background-color:#FFF9D6; font-family: Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding:50px 0; background-color:#FFF9D6;">
    <tr>
      <td align="center">

        <!-- 메인 카드 -->
        <table width="600" cellpadding="0" cellspacing="0"
               style="background-color:#ffffff;
                      border-radius:16px;
                      box-shadow:0 10px 30px rgba(0,0,0,0.08);
                      padding:48px 40px;">

          <!-- 로고 -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="cid:logo" alt="Ho-Bee" width="140" style="display:block;">
            </td>
          </tr>

          <!-- 제목 -->
          <tr>
            <td align="center"
                style="font-size:22px;
                       font-weight:bold;
                       color:#452829;
                       padding-bottom:12px;">
              이메일 인증번호 안내
            </td>
          </tr>

          <!-- 설명 -->
          <tr>
            <td align="center"
                style="font-size:15px;
                       color:#555;
                       line-height:1.6;
                       padding-bottom:32px;">
              Ho-Bee에 오신 것을 환영합니다 <br>
              아래 인증번호를 화면에 입력해 주세요.
            </td>
          </tr>

          <!-- 인증번호 박스 -->
          <tr>
            <td align="center">
              <div style="
                display:inline-block;
                background-color:#FFF57E;
                color:#452829;
                font-size:26px;
                font-weight:bold;
                letter-spacing:4px;
                padding:16px 36px;
                border-radius:12px;
                border:2px solid #452829;">
                <span th:text="${authKey}">123456</span>
              </div>
            </td>
          </tr>

          <!-- 유효시간 -->
          <tr>
            <td align="center"
                style="padding-top:24px;
                       font-size:13px;
                       color:#888;">
              ⏰ 인증번호는 <strong>5분</strong> 동안만 유효합니다.
            </td>
          </tr>

          <!-- 구분선 -->
          <tr>
            <td style="padding:40px 0 20px;">
              <hr style="border:none; height:1px; background-color:#eee;">
            </td>
          </tr>

          <!-- 푸터 안내 -->
          <tr>
            <td align="center"
                style="font-size:12px;
                       color:#999;
                       line-height:1.6;">
              본 메일은 발신 전용입니다.<br>
              인증 요청을 하지 않으셨다면 이 메일을 무시해 주세요.
            </td>
          </tr>

        </table>

        <!-- 하단 카피 -->
        <table width="600" cellpadding="0" cellspacing="0" style="margin-top:20px;">
          <tr>
            <td align="center"
                style="font-size:12px;
                       color:#777;">
              All Contents Copyright © Team Ho-Bee
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
