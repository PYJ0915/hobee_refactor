<!DOCTYPE html>
<html lang="ko"  xmlns:th="http://thymeleaf.org"> <!-- xmlns:th="http://thymeleaf.org" 타임리프 사용 시 붙히기!!!!!-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <th:block th:replace="~{common/fragments/header}"></th:block>

    <main>

        <h1>로그인</h1>

        <form action="/member/loginPage" method="post" name="login" id="login">
            <section>

                <div id="loginMember">
                    <h3>아이디</h3>
                    <input type="text" name="memberId" class="memberId" id="memberId" placeholder="아이디">
        
                    <h3>비밀번호</h3>
                    <input type="password" name="memberPw" class="memberPw" id="memberPw" placeholder="비밀번호">
                </div>
    
                <button id="login-btn">로그인</button>
                
                <label>
                    <input type="checkbox" name="saveId">아이디 저장
                </label>
                
            </section>
        </form>
        
        <div>
            <button id="idSearch">아이디 찾기</button>
            <button id="pwSearch">비밀번호 찾기</button>
        </div>


    </main>
    
    
    <!--th:inline ="javascript" 왜 사용하냐 자동으로 형변환 해줌!-->
    <script th:inline ="javascript">
        const message = /*[[${message}]]*/ "전달 받은 message"; 
        // "전달 받은 message" 이 부분은 /**/ <- 여기에 값이 없을 경우 undefined 
        // 그래서 "전달 받은 message" 이걸 적어줘야 오류 안남

        if(message != null){
            alert(message);
        };

    </script>


    <th:block th:replace="~{common/fragments/footer}"></th:block>



    
    
    <!-- js -->
    <script src="/js/member/login.js"></script>
    
</body>
</html>
