<header class="header">
  <div class="header-inner">

    <!-- 로고 -->
    <a href="/" class="header-logo">
      <img src="/images/logo/logo-header.png" alt="Ho-bee 로고">
    </a>

    <!-- 네비게이션 -->
    <nav class="header-nav">
      <a href="#" class="nav-item">공지 게시판</a>
      <a href="#" class="nav-item">취미별 게시판</a>
      <a href="#" class="nav-item">자유 게시판</a>
      <a href="/findHobby/main" class="nav-item">취미 탐색</a>
    </nav>

    <!-- 비로그인 상태 인증 영역 -->
    <th:block th:if="${session.loginMember} == null">
      <div class="header-auth">
        <a href="#" class="login-btn">로그인</a>
        <a href="#" class="signup-btn">회원가입</a>
      </div>
    </th:block>


    <!-- 로그인 상태 사용자 영역 -->
    <th:block th:unless="${session.loginMember == null}">
    <div class="header-user-loggedin">

      <img
        src="/images/user.png"
        alt="프로필 이미지"
        class="header-profile-img"
      >
      
      <span class="header-user-name">
        홍길동 님
      </span>

      <a href="/logout" class="header-btn-logout">
        로그아웃
      </a>

    </div>
    </th:block>


  </div>

  </div>
</header>
