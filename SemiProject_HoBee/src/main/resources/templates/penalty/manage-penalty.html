<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>제재 회원 관리 | Ho-Bee</title>

  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/penalty/manage-penalty.css}">
</head>
<body>

<!-- 헤더 -->
<th:block th:replace="~{common/fragments/header}" />

<main class="page-wrapper">

  <section class="manage-container">

    <h1 class="page-title">제재 회원 관리</h1>
    <p class="page-desc">
      일시적 계정 이용 제한 및 영구정지 처리된 회원을 관리할 수 있습니다.
    </p>

    <!-- 테이블 -->
    <table class="manage-table">

      <thead>
        <tr>
          <th>회원 닉네임</th>
          <th>제재 유형</th>
          <th>제재 사유</th>
          <th>제재 시작일</th>
          <th>제재 종료일</th>
          <th>관리</th>
        </tr>
      </thead>

      <tbody>

        <!-- 데이터 있을 때 -->
        <tr th:each="penalty : ${penaltyList}">
          <td th:text="${penalty.memberNickname}" class="member-nickname">길동이</td>

          <td>
            <span class="badge suspend"
                  th:if="${penalty.penaltyType == 'SUSPEND'}">
              정지
            </span>

            <span class="badge permanent"
                  th:if="${penalty.penaltyType == 'PERMANENT'}">
              영구정지
            </span>
          </td>

          <td th:text="${penalty.penaltyReason}">
            욕설 및 혐오 표현
          </td>

          <td th:text="${#temporals.format(penalty.penaltyStartDate,'yyyy년 MM월 dd일')}">
            2025-01-01
          </td>

          <td th:text="${#temporals.format(penalty.penaltyEndDate,'yyyy년 MM월 dd일')}">
            2025-01-15
          </td>

          <td class="action-cell">
            <!-- 정지 회원만 해제 가능 -->
            <button class="action-btn release"
                    th:classappend="${penalty.penaltyType == 'SUSPEND' ? 'yellow' : 'red'}"
                    th:data-penalty-no="${penalty.penaltyNo}"
                    th:data-penalty-type="${penalty.penaltyType}"
                    th:data-member-nickname="${penalty.memberNickname}">
              정지 해제
            </button>
          </td>
        </tr>

        <!-- 데이터 없을 때 -->
        <tr th:if="${#lists.isEmpty(penaltyList)}">
          <td colspan="6" class="empty-row">
            현재 제재된 회원이 없습니다.
          </td>
        </tr>

      </tbody>
    </table>

    <!-- 신고가 있을 때만 페이지네이션이 보이게 할 예정 -->
      <div class="pagination-area" th:if="${!#lists.isEmpty(penaltyList)}">
		<th:block th:replace="~{common/fragments/pagination :: pagination(${pagination})}" />
      </div>

  </section>

</main>

<!-- 푸터 -->
<th:block th:replace="~{common/fragments/footer}" />

<script src="/js/penalty/manage-penalty.js"></script>
</body>
</html>
