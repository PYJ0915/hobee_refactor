<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객센터</title>

     <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/footerLink/cs.css">

</head>
<body>
    
    <th:block th:replace="~{common/fragments/header}"></th:block>

    <div class="cs-container">

    <h1 class="cs-title">고객센터</h1>

    <!-- FAQ 영역 -->
    <section class="faq-section">
        <h2 class="section-title">자주 묻는 질문 (FAQ)</h2>

        <div class="faq-item">
            <button class="faq-question">회원가입은 어떻게 하나요?</button>
            <div class="faq-answer">
                Ho-Bee 상단 메뉴의 회원가입 버튼을 눌러 간단한 정보 입력 후 가입할 수 있습니다.
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-question">비밀번호를 잊어버렸어요.</button>
            <div class="faq-answer">
                로그인 화면의 '비밀번호 찾기' 메뉴에서 등록된 이메일을 통해 재설정할 수 있습니다.
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-question">문의는 어디로 보내나요?</button>
            <div class="faq-answer">
                아래 1:1 문의 작성 또는 team-hobee@hobee.co.kr 로 보내주시면 확인 후 답변드립니다.
            </div>
        </div>
    </section>

    <!-- 1:1 문의 영역 -->
    <section class="contact-section">
        <h2 class="section-title">1:1 문의하기</h2>

        <form class="contact-form">
            <label>이름</label>
            <input type="text" placeholder="이름을 입력하세요">

            <label>이메일</label>
            <input type="email" placeholder="이메일을 입력하세요">

            <label>문의 내용</label>
            <textarea placeholder="문의 내용을 입력하세요"></textarea>

            <button type="submit" class="btn-submit">문의 보내기</button>
        </form>
    </section>

</div>

<script>
    // FAQ 열기/닫기 기능
    const questions = document.querySelectorAll(".faq-question");

    questions.forEach(q => {
        q.addEventListener("click", () => {
            const answer = q.nextElementSibling;

            answer.style.display = answer.style.display === "block" ? "none" : "block";
        });
    });
</script>


    <th:block th:replace="~{common/fragments/footer}"></th:block>
</body>
</html>
