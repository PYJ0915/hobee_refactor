<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>서버 오류 | Ho-Bee</title>

  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/error.css}">
  <th:block th:replace="~{common/common}"></th:block>
</head>
<body>

<!-- 헤더 -->
<main class="error-container">

  <section class="error-box">
    <h1 class="error-code">500</h1>
    <p class="error-title">잠시 문제가 발생했어요</p>

    <p class="error-desc">
      서버에서 일시적인 오류가 발생했어요.<br>
      잠시 후 다시 시도해 주세요.
    </p>

    <div class="error-divider"></div>

    <div class="error-help">
      <p>이런 경우에 이 페이지가 보여질 수 있어요</p>
      <ul>
        <li>서버 점검 또는 일시적인 장애</li>
        <li>요청이 일시적으로 처리되지 못한 경우</li>
        <li>잠시 후 자동으로 해결되는 문제</li>
      </ul>
    </div>

    <a href="/" class="error-btn">메인으로 돌아가기</a>
  </section>

</main>

<!-- 푸터 -->
</body>
</html>
