<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${boardName}${hobbyName != null ? ' - ' + hobbyName : ''}|"></title>

    <th:block th:replace="~{common/common}"></th:block>
    <link rel="stylesheet" href="/css/board/boardList-style.css">
    <link rel="stylesheet" href="/css/common.css">
</head>

<body>
    <th:block th:replace="~{common/fragments/header}"></th:block>

    <th:block th:if="${boardCode == 2}">
        <th:block th:replace="~{common/fragments/hobbyCategory}"></th:block>
    </th:block>

    <section class="board-list">
        <h1 th:text="${hobbyName != null} ? |${hobbyName} 게시판| : ${boardName}" class="board-name"></h1>

        <!-- TOP / 공지 -->
        <th:block th:if="${boardCode != 1}">
            <th:block
                th:replace="~{common/fragments/rankNoticeSection :: rankNoticeSection(${hobbyName}, ${boardName}, ${bestList}, ${noticeList})}">
            </th:block>
        </th:block>


        <div class="list-wrapper">
            <table class="list-table">
                <thead>
                    <tr>
                        <th>글번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th data-sort="date">작성일<span class="sort-icon"> ↕</span></th>
						<th data-sort="view">조회수<span class="sort-icon"> ↕</span></th>
						<th data-sort="like">좋아요<span class="sort-icon"> ↕</span></th>
                    </tr>
                </thead>

                <tbody>
                    <th:block th:if="${#lists.isEmpty(boardList)}">
                        <tr>
                            <td colspan="6" style="text-align: center;">게시글이 존재하지 않습니다.</td>
                        </tr>
                    </th:block>

                    <th:block th:unless="${#lists.isEmpty(boardList)}">
                        <tr th:each="board : ${boardList}" th:object="${board}">
                            <td th:text="*{boardNo}">게시글 번호</td>

                            <td>
                                <!-- 취미 게시판 아닐 때 -->
                                <!-- 검색 조건 있을 때 -->
                                <a th:if="${boardCode != 2 and !#strings.isEmpty(param.key)}" th:href="@{/board/detail/{boardCode}/{boardNo}
                                (boardCode=${boardCode}, 
                                boardNo=*{boardNo}, 
                                cp=${pagination.currentPage}, 
                                key=${param.key}, 
                                query=${param.query})}" th:text="*{boardTitle}">
                                </a>

                                <!-- 검색 조건 없을 때 -->
                                <a th:if="${boardCode != 2 and #strings.isEmpty(param.key)}"
                                    th:href="@{/board/detail/{boardCode}/{boardNo}(boardCode=${boardCode}, boardNo=*{boardNo}, cp=${pagination.currentPage})}"
                                    th:text="*{boardTitle}">
                                </a>


                                <!-- 취미 게시판일 때 -->
                                <!-- 검색 조건 있을 때 -->
                                <a th:if="${boardCode == 2 and !#strings.isEmpty(param.key)}" th:href="@{/board/detail/{boardCode}/{categoryCode}/{boardNo}(boardCode=${boardCode}, 
                                categoryCode=${categoryCode}, 
                                boardNo=*{boardNo}, cp=${pagination.currentPage},key=${param.key}, 
                                query=${param.query})}" th:text="*{boardTitle}">
                                </a>

                                <!-- 검색 조건 없을 때 -->
                                <a th:if="${boardCode == 2 and #strings.isEmpty(param.key)}" 
                                th:href="@{/board/detail/{boardCode}/{categoryCode}/{boardNo}
                                (boardCode=${boardCode},
                                categoryCode=${categoryCode}, 
                                boardNo=*{boardNo},
                                cp=${pagination.currentPage})}" 
                                th:text="*{boardTitle}">
                                </a>

                                <th:block th:text="|[*{commentCount}]|">댓글 수</th:block>
                            </td>

							<td>
							    <a th:href="@{/member/profile/{memberNo}(memberNo=*{memberNo})}"
							       th:text="*{memberNickname}"
							       class="member-link">닉네임</a>
							</td>
                            <td th:text="*{boardWriteDate}">작성일</td>
                            <td th:text="*{boardViewCount}">0</td>
                            <td th:text="*{likeCount}">0</td>
                        </tr>
                    </th:block>
                </tbody>
            </table>
        </div>

		<div th:if="${
			(boardCode == 1 && session.loginMember != null && session.loginMember.authorLevel == 2)
			||
			(boardCode != 1 && session.loginMember != null)
			}">
	        <div class="btn-area">
	            <button id="myBoardBtn"
	                th:data-board-path="${categoryCode != null} ? |board/${boardCode}/${categoryCode}|:|board/${boardCode}|" :>내 글</button>
	            <button id="insertBtn"
	                th:data-board-path="${categoryCode != null} ? |editBoard/${boardCode}/${categoryCode}|:|editBoard/${boardCode}|">글쓰기</button>
	        </div>
		</div>

        <div class="pagination-area">
			<th:block th:replace="~{common/fragments/pagination :: pagination(${pagination})}" />
        </div>

        <form th:action="${categoryCode != null} ?
        @{/board/list/{boardCode}/{categoryCode}
          (boardCode=${boardCode}, categoryCode=${categoryCode})}
        :
        @{/board/list/{boardCode}
          (boardCode=${boardCode})}" method="get" id="boardSearch">
            <select name="key" id="searchKey">
                <option value="t" th:selected="${param.key == 't'}">제목</option>
                <option value="c" th:selected="${param.key == 'c'}">내용</option>
                <option value="tc" th:selected="${param.key == 'tc'}">제목+내용</option>
                <option value="w" th:selected="${param.key == 'w'}">작성자</option>
            </select>
            <input type="text" name="query" id="searchQuery" th:value="${param.query}" placeholder="검색어를 입력해주세요.">
            <button>검색</button>
        </form>
    </section>

    <th:block th:replace="~{common/fragments/footer}"></th:block>
	
	<script th:inline="javascript">
		const boardCode = /*[[${boardCode}]]*/ "게시판 코드";
		const categoryCode = /*[[${categoryCode}]]*/ null;
	</script>

    <script src="/js/board/board.js"></script>
</body>

</html>
