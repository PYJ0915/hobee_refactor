<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세 | Ho-Bee</title>

  <link rel="stylesheet" href="../../static/css/board/boardDetail.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/board-detail.css}">
  <script src="https://kit.fontawesome.com/652d962d08.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- 헤더 -->
<th:block th:replace="~{common/fragments/header}" />

<main class="board-container">

  <!-- 게시글 영역 -->
  <section class="board-detail">

    <!-- 제목 -->
    <h1 class="board-title" th:text="${board.boardTitle}">
      취미 미술 그림 그리기
    </h1>
    

    <!-- 작성자 정보 -->
    <div class="board-writer">
      <div class="writer-left">
        <div class="profile-img"></div>

        <div class="writer-info">
          <a href="#" class="nickname" th:text="${board.memberNickname}">
            사용자닉네임
          </a>
          <span class="date"
                th:text="${#temporals.format(board.boardWriteDate,'yyyy.MM.dd')}">
            2025.01.01
          </span>
        </div>
      </div>
    </div>

    <!-- 게시글 내용 -->
    <div class="board-content" th:text="${board.boardContent}">
      게시글 내용 영역
    </div>

    <!-- 게시글 하단 액션 -->
    <div class="board-actions">
      <button class="like-btn">
        <i class="fa-solid fa-thumbs-up"></i> 좋아요 <span>12</span></button>
      <button class="report-btn">
        <i class="fa-solid fa-land-mine-on"></i> 신고</button>
    </div>

  </section>

  <!-- 댓글 영역 -->
  <section class="comment-section">

    <h2 class="comment-title">
      댓글 (<span th:text="${commentList.size()}">0</span>)
    </h2>

    <!-- 댓글 리스트 -->
    <ul class="comment-list">

      <li class="comment-item"
          th:each="comment : ${commentList}">

        <div class="comment-top">
          <div class="comment-writer">
            <div class="profile-img small"></div>

            <a href="#" class="nickname"
               th:text="${comment.memberNickname}">
              사용자닉네임
            </a>

            <span class="date"
                  th:text="${#temporals.format(comment.commentWriteDate,'yyyy.MM.dd')}">
              2025.01.01
            </span>
          </div>

          <div class="comment-actions">
            <button class="reply-btn">답글</button>
            <button class="report-btn">신고</button>
          </div>
        </div>

        <p class="comment-content"
           th:text="${comment.commentContent}">
          댓글 내용
        </p>

      </li>

    </ul>

    <!-- 댓글 작성 -->
    <div class="comment-write">
      <textarea placeholder="댓글을 입력하세요"></textarea>
      <button class="submit-btn">등록</button>
    </div>

  </section>

</main>

<!-- 푸터 -->
<th:block th:replace="~{common/fragments/footer}" />

</body>
</html>
