<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${board.boardTitle}">게시글 상세</title>

  <link rel="stylesheet" href="/SemiProject_HoBee/src/main/resources/static/css/board/boardDetail.css">

  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/board/boardDetail.css}">
</head>
<body>

<!-- 헤더 -->
<th:block th:replace="~{common/fragments/header}" />

<main class="board-detail-container">

  <!-- 게시글 영역 -->
  <section class="board-detail">

    <!-- 제목 + 작성자 -->
    <div class="board-header">
      <h1 class="board-title" th:text="${board.boardTitle}">
        취미 미술 그림 그리기
      </h1>

      <div class="board-writer">
        <div class="writer-profile"></div>

        <!-- 닉네임 클릭 영역 -->
        <div class="writer-info">
          <a href="#"
             class="writer-name"
             th:text="${board.memberNickname}">
            사용자닉네임
          </a>
          <span class="write-date"
                th:text="${#temporals.format(board.boardWriteDate,'yyyy.MM.dd')}">
            2025.01.01
          </span>
        </div>
      </div>
    </div>

    <!-- 게시글 내용 -->
    <div class="board-content"
         th:utext="${board.boardContent}">
      게시글 내용 영역
    </div>

    <!-- 게시글 하단 버튼 -->
    <div class="board-actions">
      <button class="report-btn">🚨 게시글 신고</button>
    </div>

  </section>

  <!-- 댓글 영역 -->
  <section class="comment-area">

    <h2 class="comment-title">
      댓글 (<span th:text="${commentList.size()}">0</span>)
    </h2>

    <!-- 댓글 목록 -->
    <ul class="comment-list">

      <li class="comment-item"
          th:each="comment : ${commentList}">

        <div class="comment-writer">
          <div class="comment-profile"></div>

          <a href="#"
             class="comment-name"
             th:text="${comment.memberNickname}">
            사용자닉네임
          </a>

          <span class="comment-date"
                th:text="${#temporals.format(comment.commentWriteDate,'yyyy.MM.dd')}">
            2025.01.01
          </span>

          <button class="comment-report">신고</button>
        </div>

        <p class="comment-content"
           th:text="${comment.commentContent}">
          댓글 내용
        </p>

      </li>

    </ul>

    <!-- 댓글 작성 -->
    <div class="comment-write">

      <textarea placeholder="댓글을 입력하세요"
                name="commentContent"></textarea>

      <button class="comment-submit">등록</button>

    </div>

  </section>

</main>

<!-- 푸터 -->
<th:block th:replace="~{common/fragments/footer}" />

</body>
</html>
