<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>게시글 상세 | Ho-Bee</title>

	<link rel="stylesheet" href="/css/common.css">
	<link rel="stylesheet" href="/css/board/boardDetail.css">
	<th:block th:replace="~{common/common}" />
</head>

<body>

	<!-- 헤더 -->
	<th:block th:replace="~{common/fragments/header}" />

	<main class="board-container">

		<!-- 게시글 영역 -->
		<section class="board-detail main-content">

			<!-- 제목 -->
			<h1 class="board-title" th:text="${board.boardTitle}">
				게시글 제목
			</h1>


			<!-- 작성자 정보 -->
			<div class="board-writer">
				<div class="writer-left">
					<div>
						<a th:href="@{/member/profile/{memberNo}(memberNo=${board.memberNo})}">
							<img alt="프로필 이미지" th:with="user=#{user.default.image}" th:src="${board.profileImg ?: user}"
								class="profile-img">
						</a>
					</div>

					<div class="writer-info">
						<a th:href="@{/member/profile/{memberNo}(memberNo=${board.memberNo})}" class="nickname member-link"
							th:text="${board.memberNickname}">
							닉네임
						</a>
						<span class="date" th:text="${board.boardWriteDate}">
							2025.01.01
						</span>
					</div>
				</div>
			</div>

			<!-- 게시글 내용 -->
			<div class="board-content" th:utext="${board.boardContent}">
				게시글 내용 영역
			</div>

			<!-- boardDetail.html - 모임 정보 블록 -->
			<th:block th:if="${board.boardCode == 4 and gathering != null}">

				<div class="gathering-info-box">
					<h3 class="gathering-title">모임 정보</h3>

					<div class="gathering-row">
						<span class="gathering-label">📅 날짜</span>
						<span th:text="${gathering.gatheringDate}">2025-01-01</span>
					</div>

					<div class="gathering-row">
						<span class="gathering-label">📍 장소</span>
						<span th:text="${gathering.gatheringPlace}">장소</span>
					</div>
					<div class="gathering-row" th:if="${gathering.gatheringPlaceDetail != null}">
							<span class="gathering-label">🚪 상세</span>
							<span th:text="${gathering.gatheringPlaceDetail}">상세주소</span>
						</div>	

					<div class="gathering-row">
						<span class="gathering-label">👥 인원</span>
						<span>
							<span th:text="${gathering.currentMember}">1</span>
							/
							<span th:text="${gathering.maxMember}">10</span>
							명
						</span>
					</div>

					<!-- 지도 -->
					<div id="gatheringMap" style="width:100%; height:250px;
             border-radius:10px; margin-top:12px;"></div>

					<!-- 참여 버튼 -->
					<div class="gathering-actions" th:if="${session.loginMember != null}">

						<!-- 작성자: 모임 확정 버튼 -->
						<th:block th:if="${board.memberNo == session.loginMember.memberNo}">
							<button th:if="${gathering.gatheringStatus == 'OPEN'}" id="confirmBtn"
								th:data-gathering-no="${gathering.gatheringNo}" class="gathering-btn confirm-btn">
								모임 확정하기
							</button>
							<span th:if="${gathering.gatheringStatus == 'CLOSED'}" class="gathering-closed-badge">모집 마감</span>
						</th:block>

						<!-- 일반 참여자 -->
						<th:block th:unless="${board.memberNo == session.loginMember.memberNo}">

							<!-- 미신청 상태 + 모집 중 -->
							<button th:if="${gathering.myJoinStatus == null and gathering.gatheringStatus == 'OPEN'}" id="joinBtn"
								th:data-gathering-no="${gathering.gatheringNo}" class="gathering-btn join-btn">
								참여 신청
							</button>

							<!-- 신청 대기 중 -->
							<span th:if="${gathering.myJoinStatus == 'PENDING'}" class="gathering-status-badge pending-badge">
								⏳ 수락 대기 중
							</span>
							<button th:if="${gathering.myJoinStatus == 'PENDING'}" id="cancelBtn"
								th:data-gathering-no="${gathering.gatheringNo}" class="gathering-btn cancel-btn">
								신청 취소
							</button>

							<!-- 승낙된 상태 -->
							<span th:if="${gathering.myJoinStatus == 'APPROVED'}"
								class="gathering-status-badge approved-badge-status">
								✅ 참여 확정
							</span>
							<button th:if="${gathering.myJoinStatus == 'APPROVED'}" id="cancelBtn"
								th:data-gathering-no="${gathering.gatheringNo}" class="gathering-btn cancel-btn">
								참여 취소
							</button>

							<!-- 거절된 상태 -->
							<span th:if="${gathering.myJoinStatus == 'REJECTED'}" class="gathering-status-badge rejected-badge">
								❌ 참여 거절됨
							</span>

							<!-- 모집 마감 + 미참여 -->
							<span th:if="${gathering.gatheringStatus == 'CLOSED' and gathering.myJoinStatus == null}"
								class="gathering-closed-badge">모집 마감</span>

						</th:block>

					</div>

					<!-- 작성자에게만 보이는 신청 관리 영역 -->
					<div th:if="${board.memberNo == session.loginMember?.memberNo}" class="gathering-manage-area">

						<!-- 신청 대기 목록 -->
						<div th:if="${gathering.pendingList != null and !#lists.isEmpty(gathering.pendingList)}">
							<p class="gathering-members-title">
								신청 대기 <span th:text="${#lists.size(gathering.pendingList)}">0</span>명
							</p>
							<ul class="gathering-members-list">
								<li th:each="member : ${gathering.pendingList}" class="pending-member-item">
									<img th:with="user=#{user.default.image}" th:src="${member.profileImg ?: user}"
										class="gathering-member-img">
									<span th:text="${member.memberNickname}">닉네임</span>
									<div class="member-action-btns">
										<button class="approve-btn" th:data-gathering-no="${gathering.gatheringNo}"
											th:data-member-no="${member.memberNo}">
											수락
										</button>
										<button class="reject-btn" th:data-gathering-no="${gathering.gatheringNo}"
											th:data-member-no="${member.memberNo}">
											거절
										</button>
									</div>
								</li>
							</ul>
						</div>

						<!-- 확정 참여자 목록 -->
						<div th:if="${gathering.approvedList != null and !#lists.isEmpty(gathering.approvedList)}">
							<p class="gathering-members-title">
								확정 참여자 <span th:text="${#lists.size(gathering.approvedList)}">0</span>명
							</p>
							<ul class="gathering-members-list">
								<li th:each="member : ${gathering.approvedList}">
									<img th:with="user=#{user.default.image}" th:src="${member.profileImg ?: user}"
										class="gathering-member-img">
									<span th:text="${member.memberNickname}">닉네임</span>
									<span class="approved-badge">✓ 확정</span>
								</li>
							</ul>
						</div>

					</div>

				</div>

			</th:block>

			<!-- 게시글 하단 액션 -->
			<div class="board-actions">

				<button class="like-btn" th:classappend="${board.likeCheck == 1} ? like-checked : like-unchecked">
					<i class="fa-thumbs-up boardLike" th:classappend="${board.likeCheck == 1} ? fa-solid : fa-regular"></i> 좋아요
					<span class="like-count" th:text="${board.likeCount}">12</span>
				</button>

				<th:block th:unless="${boardCode == 1}">

					<button class="report-btn" id="board-report" th:data-writer="${board.memberNickname}"
						th:data-reported-member-no="${board.memberNo}" th:data-target-no="${board.boardNo}">
						<i class="fa-solid fa-land-mine-on"></i> 신고</button>

				</th:block>
			</div>

		</section>

		<!-- 게시글 하단 컨트롤 버튼 -->
		<div class="board-control">

			<!-- 왼쪽은 비워두고 오른쪽 정렬 -->
			<div class="board-control-right">

				<!-- 목록 -->
				<a th:href="@{${gotoList}}" class="control-btn list-btn">
					목록
				</a>

				<!-- 본인 게시글일 때만 // 관리자는 모든 글 가능 -->
				<th:block th:if="${session.loginMember != null 
              and (session.loginMember.memberNo == board.memberNo
              or session.loginMember.authorLevel == 2)}">
					<button type="button" class="control-btn edit-btn" id="updateBtn">
						수정
					</button>

					<button type="button" class="control-btn delete-btn" id="deleteBtn">
						삭제
					</button>
				</th:block>

			</div>
		</div>



		<!-- 댓글 영역 -->
		<section class="comment-section">

			<h2 class="comment-title">
				댓글 (<span th:text="${board.commentList.size()}" class="comment-count">0</span>)
			</h2>

			<!-- 댓글 리스트 -->
			<ul class="comment-list" id="commentList">

				<li class="comment-item" th:each="comment : ${board.commentList}"
					th:classappend="${comment.commentNo2} != 0 ? child-comment" th:object="${comment}">


					<div class="comment-top">

						<th:block th:if="*{commentDelFl} == 'Y'">
							<p class="comment-content" th:classappend="*{commentDelFl} == 'Y' ? ' deleted'">삭제된 댓글입니다.
							</p>
						</th:block>

						<th:block th:if="*{commentDelFl} == 'N'">
							<div class="comment-writer">

								<a th:href="@{/member/profile/{memberNo}(memberNo=*{memberNo})}">
									<img class="profile-img small" th:with="user=#{user.default.image}"
										th:src="${comment.profileImg ?: user}">
								</a>

								<a th:href="@{/member/profile/{memberNo}(memberNo=${comment.memberNo})}" class="nickname member-link"
									th:text="${comment.memberNickname}">닉네임</a>

								<span class="comment-date" th:text="${comment.commentWriteDate}">
									작성일
								</span>

							</div>

							<div class="comment-actions top-actions">

								<button class="reply-btn" th:onclick="|showInsertComment(*{commentNo}, this)|">답글</button>

								<button class="report-btn comment-report" th:data-writer="${comment.memberNickname}"
									th:data-reported-member-no="${comment.memberNo}" th:data-target-no="${comment.commentNo}"
									th:data-comment-author-level="${comment.authorLevel}">신고</button>

							</div>
						</th:block>

					</div>

					<th:block th:if="*{commentDelFl} == 'N'">
						<p class="comment-content" th:text="${comment.commentContent}">
							댓글 내용
						</p>

						<div class="comment-actions bottom-actions"
							th:if="${session.loginMember != null and session.loginMember.memberNo == comment.memberNo}">
							<button th:onclick="|deleteComment(*{commentNo})|" class="del-btn fa-solid fa-trash"></button>
							<button th:onclick="|showUpdateComment(*{commentNo}, this)|" class="edit-btn fa-solid fa-pen"></button>
						</div>
					</th:block>

					<!--<div class="comment-bottom">
            <button class="comment-like-btn">
              <i class="fa-solid fa-thumbs-up"></i>
              <span th:text="${comment.likeCount}">3</span>
            </button>
          </div>-->

				</li>

			</ul>

			<!-- 댓글 작성 -->
			<div class="comment-write">
				<textarea id="commentContent" placeholder="댓글을 입력하세요"></textarea>
				<button class="submit-btn" id="submit-btn">등록</button>
			</div>

		</section>


	</main>

	<!-- 신고 모달 -->
	<div class="report-modal popup-hidden" id="reportModal">

		<div class="modal-backdrop"></div>

		<div class="modal-box">
			<div class="modal-header">
				<h2>신고하기</h2>
				<button class="close-btn">&times;</button>
			</div>

			<div class="modal-body">

				<div class="report-info">
					<p><strong>작성자</strong> <span id="reportWriter">홍길동</span></p>
				</div>

				<h3 class="reason-title">사유 선택</h3>

				<ul class="reason-list">
					<li><label><input type="radio" name="reason" value="혐오/차별/욕설"> 혐오/차별/욕설 표현입니다.</label></li>
					<li><label><input type="radio" name="reason" value="스팸/홍보/도배"> 스팸/홍보/도배입니다.</label></li>
					<li><label><input type="radio" name="reason" value="청소년유해"> 청소년에게 유해한 내용입니다.</label></li>
					<li><label><input type="radio" name="reason" value="불법정보"> 불법정보를 포함하고 있습니다.</label></li>
					<li><label><input type="radio" name="reason" value="음란물"> 음란물입니다.</label></li>
					<li><label><input type="radio" name="reason" value="불쾌한표현"> 불쾌한 표현이 있습니다.</label></li>
				</ul>

				<textarea class="detail-textarea" placeholder="추가 사유를 입력해주세요 (선택)"></textarea>

				<button class="submit-report-btn">신고하기</button>
			</div>
		</div>

	</div>


	<!-- 푸터 -->
	<th:block th:replace="~{common/fragments/footer}" />

	<script th:inline="javascript">

		// - loginMember가 null 인 경우 null 반환
		const loginMemberNo = /*[[${session.loginMember?.memberNo}]]*/ "로그인 회원 번호";

		const boardAuthorLevel = /*[[${board.authorLevel}]]*/ "게시글 작성자 권한 등급";

		// 현재 게시글 번호를 전역 변수로 저장
		const boardNo = /*[[${board.boardNo}]]*/ "게시글 번호";

		// 현재 게시판 코드 번호를 전역 변수로 저장
		const boardCode = /*[[${board.boardCode}]]*/ "게시판 코드 번호";

		const categoryCode = /*[[${categoryCode}]]*/ null;

		// 현재 게시글 좋아요 여부를 전역 변수로 저장
		let likeCheck = /*[[${board.likeCheck}]]*/ "좋아요 여부";

		const userDefaultImage = /*[[#{user.default.image}]]*/ "기본이미지";

	</script>

	<!-- 카카오맵 SDK -->
	<script th:if="${board.boardCode == 4 and gathering != null}"
        th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=55f99a0cab068e0d7c6881e08679cd8f&libraries=services&autoload=false|">
</script>

<script th:if="${board.boardCode == 4 and gathering != null}" th:inline="javascript">
    const gatheringLat   = /*[[${gathering.placeLat}]]*/  37.5665;
    const gatheringLng   = /*[[${gathering.placeLng}]]*/  126.9780;
    const gatheringPlace = /*[[${gathering.gatheringPlace}]]*/ "";
</script>

<script th:if="${board.boardCode == 4 and gathering != null}"
        src="/js/gathering/gatheringDetail.js">
</script>

	<script src="/js/board/boardDetail.js"></script>

	<script src="/js/board/comment.js"></script>
</body>

</html>
